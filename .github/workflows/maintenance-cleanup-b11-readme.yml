name: Maintenance - Clean B11 README

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-cleanup-b11-readme.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean B11 README integration
        run: python .github/scripts/cleanup_b11_readme.py
      - name: Commit cleanup and remove temporary files
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/maintenance-cleanup-b11-readme.yml .github/scripts/cleanup_b11_readme.py
          git add README.md
          git commit -m 'Clean B11 README integration [skip ci]'
          git push
