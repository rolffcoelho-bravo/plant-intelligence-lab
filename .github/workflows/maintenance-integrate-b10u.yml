name: Maintenance - Integrate B10-U Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-integrate-b10u.yml'

permissions:
  contents: write

jobs:
  integrate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch README and limitations
        run: python .github/scripts/patch_b10u_docs.py
      - name: Commit documentation
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add README.md docs/limitations.md
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate B10-U into public documentation [skip ci]'
            git push
          fi
