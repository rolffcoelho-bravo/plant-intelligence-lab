name: Case Study B13 - Safe 2023 Source Probe

on:
  workflow_dispatch:
  push:
    branches:
      - agent/b13-sequential-drift-calibration
    paths:
      - '.github/workflows/case-study-b13-safe-source-probe.yml'

permissions:
  contents: read

jobs:
  safe-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install safe probe dependencies
        run: python -m pip install pandas requests python-docx
      - name: Audit outcome-free competition documentation for season boundaries
        run: |
          python - <<'PY'
          from io import BytesIO
          import re
          import pandas as pd
          import requests
          from docx import Document

          auth = ('anonymous', '')
          headers = {'User-Agent': 'plant-intelligence-lab/0.1 B13-safe-probe'}
          root = (
              'https://data.cyverse.org/dav/iplant/projects/commons_repo/curated/'
              'GenomesToFields_GenotypeByEnvironment_PredictionCompetition_2025'
          )
          forbidden = '1_training_trait_data_2014_2023.csv'

          def safe_get(url, **kwargs):
              if forbidden in url.lower():
                  raise RuntimeError('Safety violation: target trait requested')
              response = requests.get(
                  url,
                  auth=auth,
                  headers={**headers, **kwargs.pop('headers', {})},
                  timeout=(30, 240),
                  allow_redirects=True,
                  **kwargs,
              )
              if forbidden in str(response.url).lower():
                  raise RuntimeError('Safety violation: redirect entered target trait')
              return response

          def relevant_lines(text):
              lines = [re.sub(r'\s+', ' ', line).strip() for line in text.splitlines()]
              tokens = ('season', 'weather', 'plant', 'sow', 'harvest', 'date', 'dap')
              return [line for line in lines if line and any(t in line.lower() for t in tokens)]

          for name in ('readme.txt', 'README.txt'):
              r = safe_get(root + '/' + name)
              print('COMP_README_STATUS', name, r.status_code, r.headers.get('content-type'), len(r.content), r.url)
              if r.ok and r.content and b'<html' not in r.content[:1500].lower():
                  print('COMP_README_RELEVANT_BEGIN')
                  for line in relevant_lines(r.text)[:1000]:
                      print(line)
                  print('COMP_README_RELEVANT_END')
                  break

          doc = safe_get(root + '/COMPETITION_DATA_README.docx')
          print('COMP_DOCX_STATUS', doc.status_code, doc.headers.get('content-type'), len(doc.content), doc.url)
          if doc.ok and doc.content[:2] == b'PK':
              document = Document(BytesIO(doc.content))
              chunks = [p.text for p in document.paragraphs]
              for table in document.tables:
                  for row in table.rows:
                      chunks.append(' | '.join(cell.text for cell in row.cells))
              text = '\n'.join(chunks)
              print('COMP_DOCX_RELEVANT_BEGIN')
              for line in relevant_lines(text)[:2000]:
                  print(line)
              print('COMP_DOCX_RELEVANT_END')

          weather_url = root + '/Training_data/4_Training_Weather_Data_2014_2023_seasons_only.csv'
          w = safe_get(weather_url)
          print('SEASONS_WEATHER_STATUS', w.status_code, w.headers.get('content-type'), len(w.content), w.url)
          if w.ok and w.content and b'<html' not in w.content[:1500].lower():
              frame = pd.read_csv(BytesIO(w.content), low_memory=False)
              print('SEASONS_WEATHER_COLUMNS=' + repr(list(map(str, frame.columns))))
              env_candidates = [c for c in frame.columns if 'env' in str(c).lower() or 'location' in str(c).lower()]
              date_candidates = [c for c in frame.columns if 'date' in str(c).lower()]
              year_candidates = [c for c in frame.columns if str(c).lower() == 'year']
              print('SEASONS_ENV_CANDIDATES=' + repr(env_candidates))
              print('SEASONS_DATE_CANDIDATES=' + repr(date_candidates))
              print('SEASONS_YEAR_CANDIDATES=' + repr(year_candidates))
              if date_candidates:
                  date_col = date_candidates[0]
                  dates = pd.to_datetime(frame[date_col], errors='coerce')
                  mask = dates.dt.year.eq(2023)
                  target = frame.loc[mask].copy()
                  target['_date'] = dates.loc[mask]
                  if env_candidates and not target.empty:
                      env_col = env_candidates[0]
                      bounds = target.groupby(env_col)['_date'].agg(['min','max','count']).reset_index()
                      print('SEASONS_2023_BOUNDS_BEGIN')
                      print(bounds.to_string(index=False, max_rows=200))
                      print('SEASONS_2023_BOUNDS_END')
          PY
