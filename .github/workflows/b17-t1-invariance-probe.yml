name: Temporary B17-T1 invariance probe

on:
  push:
    branches:
      - agent/b17-t1-architecture-contraction-novelty
    paths:
      - '.github/workflows/b17-t1-invariance-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Print exact seal-only invariance diagnostics
        run: |
          python - <<'PY'
          import pandas as pd
          from plant_intelligence.diagnostics.maize_b17_t1_architecture_contraction import (
              pairwise_invariance_audit,
              validate_sealed_predictions,
          )
          f = validate_sealed_predictions(pd.read_csv('reports/results/case_study_b14b_2024_sealed_predictions.csv', low_memory=False))
          a, s = pairwise_invariance_audit(f, tolerance=1e-8)
          print('SUMMARY')
          print(s)
          print('TOP MAX PAIRWISE DEVIATIONS')
          print(a.sort_values('max_abs_pairwise_contrast_deviation', ascending=False).head(20).to_string(index=False))
          print('TOP OFFSET SD')
          print(a.sort_values('environment_offset_sd_across_common_genotypes', ascending=False).head(20).to_string(index=False))
          PY
