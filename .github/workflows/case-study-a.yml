name: Case Study A — Real Data Execution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'notebooks/01_data_discovery.ipynb'
      - 'notebooks/03_genomic_prediction.ipynb'
      - 'src/plant_intelligence/data/**'
      - 'src/plant_intelligence/genetics/**'
      - 'src/plant_intelligence/models/**'
      - 'src/plant_intelligence/forecasting/**'
      - '.github/workflows/case-study-a.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research environment with boosting
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[notebooks,ml]'
          python -m pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Normalize notebooks for current nbformat
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          for name in ('01_data_discovery.ipynb', '03_genomic_prediction.ipynb'):
              path = Path('notebooks') / name
              nb = nbformat.read(path, as_version=4)
              nbformat.validator.normalize(nb)
              nbformat.write(nb, path)
          PY

      - name: 01 — Download and profile real phenotype data
        working-directory: notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 01_data_discovery.ipynb \
            --output 01_data_discovery.executed.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.kernel_name=python3

      - name: 02 — Download genomics, intersect accessions and build genomic structure
        run: |
          echo 'Starting 1001 Genomes acquisition and genomic QC.'
          python -u -m plant_intelligence.genetics.genomic_structure

      - name: Verify genomic modelling inputs
        run: |
          test -s data/interim/case_study_a/shoot_regeneration_accession_summary.csv
          test -s data/processed/case_study_a/genomic_relationship_matrix.npy
          test -s data/processed/case_study_a/genotype_matrix_qc.npy
          test -s data/processed/case_study_a/model_accessions.csv
          test -s data/processed/case_study_a/genotype_aware_folds.csv

      - name: 03 — Fit GBLUP baseline on real matched data
        run: python -u -m plant_intelligence.genetics.genomic_prediction

      - name: 04 — Benchmark high-dimensional genomic ML and boosting
        run: python -u -m plant_intelligence.models.ml_benchmark

      - name: 05 — Quantify genotype-specific protocol response
        run: python -u -m plant_intelligence.forecasting.protocol_response

      - name: 06 — Forecast Day-21 regeneration from early biological observations
        run: python -u -m plant_intelligence.forecasting.early_forecasting

      - name: Build execution inventory
        if: always()
        run: |
          mkdir -p reports/results reports/figures
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          root = Path('.')
          payload = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'result_files': sorted(str(p) for p in (root/'reports'/'results').glob('*') if p.is_file()),
              'figure_files': sorted(str(p) for p in (root/'reports'/'figures').glob('*') if p.is_file()),
              'executed_notebooks': sorted(str(p) for p in (root/'notebooks').glob('*.executed.ipynb')),
          }
          (root/'reports'/'results'/'case_study_a_execution_inventory.json').write_text(
              json.dumps(payload, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload empirical execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-study-a-real-data-execution
          if-no-files-found: warn
          retention-days: 30
          path: |
            notebooks/*.executed.ipynb
            reports/results/**
            reports/figures/**
            data/interim/case_study_a/**
            data/processed/case_study_a/**

      - name: Publish compact results
        if: success()
        run: |
          git checkout -- notebooks/01_data_discovery.ipynb notebooks/03_genomic_prediction.ipynb
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/results reports/figures
          if git diff --cached --quiet; then
            echo 'No new compact public outputs to publish.'
          else
            git commit -m 'Publish Case Study A empirical outputs [skip ci]'
            git push
          fi
