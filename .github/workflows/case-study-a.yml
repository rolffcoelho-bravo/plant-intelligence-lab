name: Case Study A — Real Data Execution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'notebooks/01_data_discovery.ipynb'
      - 'notebooks/02_genomic_structure.ipynb'
      - 'notebooks/03_genomic_prediction.ipynb'
      - 'pyproject.toml'
      - '.github/workflows/case-study-a.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and notebook runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install jupyter nbconvert

      - name: Execute 01 — Data Discovery
        working-directory: notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 01_data_discovery.ipynb \
            --output 01_data_discovery.executed.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Execute 02 — Genomic Structure
        working-directory: notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 02_genomic_structure.ipynb \
            --output 02_genomic_structure.executed.ipynb \
            --ExecutePreprocessor.timeout=10800 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Execute 03 — GBLUP Genomic Prediction
        working-directory: notebooks
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute 03_genomic_prediction.ipynb \
            --output 03_genomic_prediction.executed.ipynb \
            --ExecutePreprocessor.timeout=7200 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Build execution inventory
        if: always()
        run: |
          mkdir -p reports/results reports/figures
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          root = Path('.')
          payload = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'result_files': sorted(str(p) for p in (root/'reports'/'results').glob('*') if p.is_file()),
              'figure_files': sorted(str(p) for p in (root/'reports'/'figures').glob('*') if p.is_file()),
              'executed_notebooks': sorted(str(p) for p in (root/'notebooks').glob('*.executed.ipynb')),
          }
          (root/'reports'/'results'/'case_study_a_execution_inventory.json').write_text(
              json.dumps(payload, indent=2), encoding='utf-8'
          )
          PY

      - name: Upload complete empirical execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-study-a-real-data-execution
          if-no-files-found: warn
          retention-days: 30
          path: |
            notebooks/*.executed.ipynb
            reports/results/**
            reports/figures/**
            data/interim/case_study_a/**
            data/processed/case_study_a/**

      - name: Publish compact public results
        if: success()
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/results reports/figures
          if git diff --cached --quiet; then
            echo 'No new compact public outputs to publish.'
          else
            git commit -m 'Publish Case Study A empirical outputs [skip ci]'
            git push
          fi
