name: Case Study A — Real Data Execution

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'notebooks/01_data_discovery.ipynb'
      - 'notebooks/03_genomic_prediction.ipynb'
      - 'src/plant_intelligence/data/arapheno.py'
      - 'src/plant_intelligence/genetics/**'
      - 'src/plant_intelligence/models/__init__.py'
      - 'src/plant_intelligence/models/boosting.py'
      - 'src/plant_intelligence/models/evaluation.py'
      - 'src/plant_intelligence/models/kernel.py'
      - 'src/plant_intelligence/models/linear.py'
      - 'src/plant_intelligence/models/ml_benchmark.py'
      - 'src/plant_intelligence/models/tree.py'
      - 'src/plant_intelligence/forecasting/**'
      - '.github/workflows/case-study-a.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research environment with boosting
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[ml]'
          python -m pip install pytest nbconvert nbformat

      - name: Run unit tests
        run: pytest -q

      - name: Normalize executed notebooks
        run: |
          python - <<'PY'
          import glob
          import nbformat
          from pathlib import Path
          for path in glob.glob('notebooks/*.ipynb'):
              nb = nbformat.read(path, as_version=4)
              changed = False
              for cell in nb.cells:
                  if cell.cell_type == 'code':
                      if cell.get('execution_count') is not None:
                          cell['execution_count'] = None
                          changed = True
                      if cell.get('outputs'):
                          cell['outputs'] = []
                          changed = True
              if changed:
                  nbformat.write(nb, path)
          PY

      - name: 01 — Acquire public phenotype data
        run: python -u notebooks/run_data_discovery.py

      - name: 02 — Build genomic structure and validation folds
        run: python -u -m plant_intelligence.genetics.genomic_structure

      - name: Verify modelling inputs
        run: |
          test -s data/processed/case_study_a/model_accessions.csv
          test -s data/processed/case_study_a/genotype_matrix_qc.npy
          test -s data/processed/case_study_a/genomic_relationship_matrix.npy
          test -s data/processed/case_study_a/genotype_aware_folds.csv

      - name: 03 — Run GBLUP baseline
        run: python -u -m plant_intelligence.genetics.genomic_prediction

      - name: 04 — Run high-dimensional ML benchmark
        run: python -u -m plant_intelligence.models.ml_benchmark

      - name: 05 — Quantify protocol-response heterogeneity
        run: python -u -m plant_intelligence.forecasting.protocol_response

      - name: 06 — Run early phenotype forecasting
        run: python -u -m plant_intelligence.forecasting.early_forecasting

      - name: Build execution inventory
        run: |
          find reports/results -maxdepth 1 -type f -printf '%f\n' | sort > reports/results/case_study_a_execution_inventory.txt

      - name: Upload full execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: case-study-a-full-execution
          path: |
            reports/results/
            reports/figures/
          retention-days: 30

      - name: Publish compact results
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/results reports/figures
          if git diff --cached --quiet; then
            echo 'No new compact results to publish.'
          else
            git commit -m 'Publish Case Study A empirical outputs [skip ci]'
            git push
          fi