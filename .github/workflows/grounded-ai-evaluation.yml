name: Grounded AI Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/ai/**'
      - 'tests/test_grounded_interface.py'
      - 'tests/test_grounded_ai_phase2.py'
      - '.github/workflows/grounded-ai-evaluation.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run grounded AI tests
        run: |
          pytest -q tests/test_grounded_interface.py tests/test_grounded_ai_phase2.py

      - name: Run grounding benchmark
        run: |
          python -m plant_intelligence.ai.evaluation --output-dir reports/results
          test -s reports/results/grounded_ai_evaluation_cases.csv
          test -s reports/results/grounded_ai_evaluation_summary.csv

      - name: Publish compact grounding benchmark
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/results/grounded_ai_evaluation_cases.csv \
                  reports/results/grounded_ai_evaluation_summary.csv
          if git diff --cached --quiet; then
            echo 'No new grounding benchmark outputs to publish.'
          else
            git commit -m 'Publish grounded AI evaluation results [skip ci]'
            git push
          fi
