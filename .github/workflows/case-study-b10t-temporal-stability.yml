name: Case Study B - Temporal Geometry Stability Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/models/maize_geometry_temporal_stability.py'
      - 'tests/test_case_study_b10t_temporal_stability.py'
      - '.github/workflows/case-study-b10t-temporal-stability.yml'

permissions:
  contents: write

jobs:
  temporal-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Validate B10-T implementation
        run: pytest -q tests/test_case_study_b10t_temporal_stability.py

      - name: Verify frozen B10-R evidence
        run: |
          test -s reports/results/case_study_b10r_geometry_sensitivity_by_year.csv
          test -s reports/results/case_study_b10r_year_summary.csv
          test -s reports/results/case_study_b10r_kernel_geometry.csv

      - name: Execute B10-T temporal stability audit
        run: python -u -m plant_intelligence.models.maize_geometry_temporal_stability --output-root .

      - name: Verify B10-T evidence
        run: |
          test -s reports/results/case_study_b10t_geometry_rank_table.csv
          test -s reports/results/case_study_b10t_rank_stability.csv
          test -s reports/results/case_study_b10t_config_stability.csv
          test -s reports/results/case_study_b10t_shift_alignment.csv
          test -s reports/results/case_study_b10t_shift_associations.csv
          test -s reports/results/case_study_b10t_summary.csv
          test -s reports/figures/case_study_b10t_temporal_stability.png
          python - <<'PY'
          import pandas as pd

          ranks = pd.read_csv('reports/results/case_study_b10t_geometry_rank_table.csv')
          stability = pd.read_csv('reports/results/case_study_b10t_rank_stability.csv')
          config = pd.read_csv('reports/results/case_study_b10t_config_stability.csv')
          shift = pd.read_csv('reports/results/case_study_b10t_shift_alignment.csv')
          assoc = pd.read_csv('reports/results/case_study_b10t_shift_associations.csv')
          summary = pd.read_csv('reports/results/case_study_b10t_summary.csv')

          assert len(ranks) == 72
          assert ranks.test_year.astype(int).nunique() == 6
          assert ranks.config.nunique() == 12
          assert len(stability) == 5
          assert len(config) == 12
          assert len(shift) == 5
          assert len(assoc) == 11
          assert assoc.descriptive_only_small_n.astype(bool).all()
          assert summary.loc[0, 'controller_admission'] == 'NOT_JUSTIFIED_BY_RANK_PERSISTENCE_AUDIT'
          assert not stability[['spearman_rank_rho','lagged_winner_regret','top3_overlap_fraction']].isna().any().any()

          print('\nB10-T adjacent-year rank stability')
          print(stability.to_string(index=False))
          print('\nB10-T per-configuration stability')
          print(config.to_string(index=False))
          print('\nB10-T outcome-free shift alignment')
          print(shift.to_string(index=False))
          print('\nB10-T descriptive shift associations')
          print(assoc.to_string(index=False))
          print('\nB10-T compact summary')
          print(summary.to_string(index=False))
          PY

      - name: Publish B10-T evidence
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add reports/results/case_study_b10t_*.csv reports/figures/case_study_b10t_temporal_stability.png
          if git diff --cached --quiet; then
            echo 'No new B10-T outputs to publish.'
          else
            git commit -m 'Publish Case Study B10-T temporal stability audit [skip ci]'
            git push
          fi
