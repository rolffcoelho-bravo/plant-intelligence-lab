name: Case Study B PUB-B2 Manuscript Scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pub-b2-case-study-b-manuscript-scaffold
    paths:
      - 'src/plant_intelligence/publication/case_study_b_pub_b2.py'
      - 'src/plant_intelligence/publication/__init__.py'
      - 'docs/case_study_b_pub_b2_manuscript_scaffold.md'
      - 'reports/results/case_study_b_pub_b2_lock.json'
      - 'reports/results/case_study_b_pub_b2_source_map.csv'
      - 'tests/test_case_study_b_pub_b2.py'
      - '.github/workflows/case-study-b-pub-b2-manuscript-scaffold.yml'
  pull_request:
    paths:
      - 'src/plant_intelligence/publication/case_study_b_pub_b2.py'
      - 'src/plant_intelligence/publication/__init__.py'
      - 'docs/case_study_b_pub_b2_manuscript_scaffold.md'
      - 'reports/results/case_study_b_pub_b2_lock.json'
      - 'reports/results/case_study_b_pub_b2_source_map.csv'
      - 'reports/publication/case_study_b/**'
      - 'tests/test_case_study_b_pub_b2.py'
      - '.github/workflows/case-study-b-pub-b2-manuscript-scaffold.yml'

permissions:
  contents: write

jobs:
  pub-b2-manuscript-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Verify PUB-B2 locks and deterministic builder
        run: pytest -q tests/test_case_study_b_pub_b2.py

      - name: Materialize frozen publication tables and figures
        run: python -u -m plant_intelligence.publication.case_study_b_pub_b2 --repo-root .

      - name: Verify generated publication package
        run: |
          test -s reports/publication/case_study_b/case_study_b_pub_b2_table_01_evidence_hierarchy.csv
          test -s reports/publication/case_study_b/case_study_b_pub_b2_table_02_external_validation_metrics.csv
          test -s reports/publication/case_study_b/case_study_b_pub_b2_table_03_2024_uncertainty_comparison.csv
          test -s reports/publication/case_study_b/case_study_b_pub_b2_table_04_2024_failure_structure.csv
          test -s reports/publication/case_study_b/case_study_b_pub_b2_figure_01_protocol_chronology.svg
          test -s reports/publication/case_study_b/case_study_b_pub_b2_figure_02_2024_external_point_prediction.svg
          test -s reports/publication/case_study_b/case_study_b_pub_b2_figure_03_2024_uncertainty_comparison.svg
          test -s reports/publication/case_study_b/case_study_b_pub_b2_figure_04_2024_failure_structure.svg
          test -s reports/publication/case_study_b/case_study_b_pub_b2_assets_manifest.csv
          python - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path('reports/results/case_study_b_pub_b2_lock.json').read_text())
          assert lock['publication_only'] is True
          assert lock['publication_assets_generated_only_from_committed_frozen_artifacts'] is True
          assert lock['new_outcome_access_permitted'] is False
          assert lock['new_prediction_generation_permitted'] is False
          assert lock['model_fitting_permitted'] is False
          assert lock['point_predictor_change_permitted'] is False
          assert lock['t2_reopening_permitted'] is False
          assert lock['interval_or_support_tuning_permitted'] is False
          assert lock['b19_authorized'] is False
          assert lock['pub_b3_authorized'] is False
          PY

      - name: Publish deterministic PUB-B2 assets
        if: github.event_name == 'push'
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add reports/publication/case_study_b
          if ! git diff --cached --quiet; then
            git commit -m 'Publish PUB-B2 frozen manuscript assets [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
