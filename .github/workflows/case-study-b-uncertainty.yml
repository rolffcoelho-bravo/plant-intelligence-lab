name: Case Study B — Uncertainty & Reliability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/uncertainty/wheat_gxe_uncertainty.py'
      - 'tests/test_case_study_b_uncertainty.py'
      - '.github/workflows/case-study-b-uncertainty.yml'

permissions:
  contents: write

jobs:
  uncertainty-reliability:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Case Study B environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[case-study-b]'
          python -m pip install pytest

      - name: Validate Step B4 implementation
        run: |
          pytest -q tests/test_case_study_b_uncertainty.py

      - name: Verify frozen prediction evidence
        run: |
          test -s reports/results/case_study_b_gxe_mixture_predictions.csv
          test -s reports/results/case_study_b_model_predictions.csv
          test -s reports/results/case_study_b_classical_benchmark_envelope.csv

      - name: Materialize locked wheat data for genomic-support diagnostics
        run: |
          python -u -m plant_intelligence.data.wheat_gxe --output-root .

      - name: Execute Step B4 uncertainty and reliability
        run: |
          python -u -m plant_intelligence.uncertainty.wheat_gxe_uncertainty --output-root .

      - name: Verify Step B4 evidence
        run: |
          test -s reports/results/case_study_b_uncertainty_predictions.csv
          test -s reports/results/case_study_b_uncertainty_coverage.csv
          test -s reports/results/case_study_b_support_diagnostics.csv
          test -s reports/results/case_study_b_selective_risk.csv
          test -s reports/results/case_study_b_deployment_boundary.csv
          test -s reports/figures/case_study_b_uncertainty_reliability.png
          cat reports/results/case_study_b_uncertainty_coverage.csv
          cat reports/results/case_study_b_support_diagnostics.csv
          cat reports/results/case_study_b_selective_risk.csv
          cat reports/results/case_study_b_deployment_boundary.csv

      - name: Publish compact Step B4 evidence
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            reports/results/case_study_b_uncertainty_predictions.csv \
            reports/results/case_study_b_uncertainty_coverage.csv \
            reports/results/case_study_b_support_diagnostics.csv \
            reports/results/case_study_b_selective_risk.csv \
            reports/results/case_study_b_deployment_boundary.csv \
            reports/figures/case_study_b_uncertainty_reliability.png
          if git diff --cached --quiet; then
            echo 'No new Step B4 outputs to publish.'
          else
            git commit -m 'Publish Case Study B uncertainty evidence [skip ci]'
            git push
          fi
