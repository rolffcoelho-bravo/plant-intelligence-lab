name: Case Study B — Prospective Environment Data Lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/data/maize_prospective_environment.py'
      - 'tests/test_case_study_b9_prospective_environment.py'
      - '.github/workflows/case-study-b9-prospective-environment.yml'

permissions:
  contents: write

jobs:
  prospective-environment-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Validate B9 time-safety implementation
        run: pytest -q tests/test_case_study_b9_prospective_environment.py

      - name: Materialize locked B5 public data and manifests
        run: python -u -m plant_intelligence.data.maize_environment_transfer --output-root .

      - name: Execute B9 prospective environmental-state data lock
        run: python -u -m plant_intelligence.data.maize_prospective_environment --output-root .

      - name: Verify B9 evidence and leakage boundaries
        run: |
          test -s reports/results/case_study_b9_source_audit.csv
          test -s reports/results/case_study_b9_environment_manifest.csv
          test -s reports/results/case_study_b9_power_weather_audit.csv
          test -s reports/results/case_study_b9_ssurgo_audit.csv
          test -s reports/results/case_study_b9_safe_environment_states.csv
          test -s reports/results/case_study_b9_horizon_lock.csv
          test -s reports/results/case_study_b9_feature_provenance.csv
          test -s reports/results/case_study_b9_forward_year_folds.csv
          test -s reports/results/case_study_b9_validation_lock.csv
          test -s reports/figures/case_study_b9_input_coverage.png
          python - <<'PY'
          import pandas as pd
          audit = pd.read_csv('reports/results/case_study_b9_source_audit.csv')
          assert int(audit.loc[0, 'future_weather_violations']) == 0
          assert int(audit.loc[0, 'observed_phenology_violations']) == 0
          assert int(audit.loc[0, 'n_horizons']) == 3
          horizons = pd.read_csv('reports/results/case_study_b9_horizon_lock.csv')
          assert not horizons['uses_future_realized_weather'].astype(bool).any()
          for c in ['uses_observed_anthesis','uses_observed_silking','uses_observed_harvest','uses_observed_yield']:
              assert not horizons[c].astype(bool).any()
          states = pd.read_csv('reports/results/case_study_b9_safe_environment_states.csv')
          assert not states['uses_future_weather'].astype(bool).any()
          assert not states['uses_observed_phenology'].astype(bool).any()
          forward = pd.read_csv('reports/results/case_study_b9_forward_year_folds.csv')
          assert (forward['train_year_max'] < forward['test_year']).all()
          print(audit.to_string(index=False))
          print(horizons.to_string(index=False))
          print(forward.groupby('test_year').size().to_string())
          PY

      - name: Publish compact B9 evidence
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/results/case_study_b9_*.csv reports/figures/case_study_b9_input_coverage.png
          if git diff --cached --quiet; then
            echo 'No new B9 outputs to publish.'
          else
            git commit -m 'Publish Case Study B9 prospective environment data lock [skip ci]'
            git push
          fi

# corrected soil-coordinate rerun
