name: Maintenance - Document Case Study B10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-document-b10.yml'

permissions:
  contents: write

jobs:
  document-b10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Patch README and limitations
        run: python .github/scripts/patch_b10_docs.py
      - name: Commit documentation
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add README.md docs/limitations.md
          if git diff --cached --quiet; then
            echo 'No B10 documentation changes.'
          else
            git commit -m 'Integrate Case Study B10 into public documentation [skip ci]'
            git push
          fi
