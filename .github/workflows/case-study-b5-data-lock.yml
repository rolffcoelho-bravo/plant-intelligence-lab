name: Case Study B — Environmental Transfer Data Lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/data/maize_environment_transfer.py'
      - 'tests/test_case_study_b5_data_lock.py'
      - '.github/workflows/case-study-b5-data-lock.yml'

permissions:
  contents: write

jobs:
  data-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Validate Step B5 implementation
        run: pytest -q tests/test_case_study_b5_data_lock.py

      - name: Execute Step B5 data lock
        run: python -u -m plant_intelligence.data.maize_environment_transfer --output-root .

      - name: Verify Step B5 evidence
        run: |
          test -s reports/results/case_study_b5_data_lock_summary.csv
          test -s reports/results/case_study_b5_environment_covariate_audit.csv
          test -s reports/results/case_study_b5_environment_transfer_folds.csv
          test -s reports/results/case_study_b5_genotype_transfer_folds.csv
          test -s reports/results/case_study_b5_gxe_transfer_scenarios.csv
          cat reports/results/case_study_b5_data_lock_summary.csv

      - name: Publish compact Step B5 evidence
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            reports/results/case_study_b5_data_lock_summary.csv \
            reports/results/case_study_b5_environment_covariate_audit.csv \
            reports/results/case_study_b5_environment_transfer_folds.csv \
            reports/results/case_study_b5_genotype_transfer_folds.csv \
            reports/results/case_study_b5_gxe_transfer_scenarios.csv
          if git diff --cached --quiet; then
            echo 'No new Step B5 outputs to publish.'
          else
            git commit -m 'Publish Case Study B5 environmental-transfer data lock [skip ci]'
            git push
          fi
