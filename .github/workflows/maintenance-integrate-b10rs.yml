name: Maintenance - Integrate B10-R and B10-S Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-integrate-b10rs.yml'

permissions:
  contents: write

jobs:
  integrate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Patch README and limitations
        run: python .github/scripts/patch_b10rs_docs.py
      - name: Commit documentation
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add README.md docs/limitations.md
          if git diff --cached --quiet; then
            echo 'No B10-R/B10-S documentation changes.'
          else
            git commit -m 'Integrate B10-R and B10-S into public documentation [skip ci]'
            git push
          fi
