name: Case Study B - Forward-Time Uncertainty & Selective Prediction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/uncertainty/maize_forward_uncertainty.py'
      - 'tests/test_case_study_b11_forward_uncertainty.py'
      - '.github/workflows/case-study-b11-forward-uncertainty.yml'

permissions:
  contents: write

jobs:
  forward-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Validate B11 implementation
        run: pytest -q tests/test_case_study_b11_forward_uncertainty.py
      - name: Verify frozen B9 B10 and B10-U evidence
        run: |
          test -s reports/results/case_study_b9_safe_environment_states.csv
          test -s reports/results/case_study_b9_environment_manifest.csv
          test -s reports/results/case_study_b9_forward_year_folds.csv
          test -s reports/results/case_study_b10_forward_year_metrics.csv
          test -s reports/results/case_study_b10u_branch_decision.csv
          python - <<'PY'
          import pandas as pd
          b10u = pd.read_csv('reports/results/case_study_b10u_branch_decision.csv')
          assert b10u['branch_decision'].eq('CLOSE_T2_ADAPTIVE_BRANCH_USE_SUPPORTED_T1').all()
          assert b10u['post_result_tuning_permitted'].astype(bool).eq(False).all()
          PY
      - name: Materialize B5 public data
        run: python -u -m plant_intelligence.data.maize_environment_transfer --output-root .
      - name: Execute B11 forward uncertainty
        run: python -u -m plant_intelligence.uncertainty.maize_forward_uncertainty --output-root .
      - name: Verify B11 evidence
        run: |
          test -s reports/results/case_study_b11_calibration_audit.csv
          test -s reports/results/case_study_b11_coverage_by_year.csv
          test -s reports/results/case_study_b11_coverage_summary.csv
          test -s reports/results/case_study_b11_support_conditioned_coverage.csv
          test -s reports/results/case_study_b11_reliability_summary.csv
          test -s reports/results/case_study_b11_selective_risk.csv
          test -s reports/results/case_study_b11_support_error_association.csv
          test -s reports/results/case_study_b11_branch_decision.csv
          test -s reports/results/case_study_b11_b10_t1_reproduction_audit.csv
          test -s reports/figures/case_study_b11_forward_coverage.png
          test -s reports/figures/case_study_b11_selective_risk.png
          python - <<'PY'
          import pandas as pd
          audit = pd.read_csv('reports/results/case_study_b11_calibration_audit.csv')
          pooled = pd.read_csv('reports/results/case_study_b11_coverage_summary.csv')
          decision = pd.read_csv('reports/results/case_study_b11_branch_decision.csv')
          repro = pd.read_csv('reports/results/case_study_b11_b10_t1_reproduction_audit.csv')
          assert sorted(audit['test_year'].astype(int).tolist()) == [2016,2017,2018,2019,2020,2021]
          assert audit.loc[audit['test_year'].isin([2016,2017]), 'status'].eq('INSUFFICIENT_CALIBRATION_HISTORY').all()
          later = audit[audit['status'].eq('CALIBRATION_AVAILABLE')]
          assert sorted(later['test_year'].astype(int).tolist()) == [2018,2019,2020,2021]
          assert (later['calibration_year_max'].astype(int) < later['test_year'].astype(int)).all()
          assert later['test_year_used_for_calibration'].astype(bool).eq(False).all()
          assert later['future_year_used_for_calibration'].astype(bool).eq(False).all()
          assert set(pooled['method']) == {'GLOBAL_FORWARD','SUPPORT_ADAPTIVE'}
          assert set(round(v, 2) for v in pooled['nominal']) == {0.80,0.90,0.95}
          assert repro['within_tolerance_1e-8'].astype(bool).all()
          assert decision['t2_branch_reopened'].astype(bool).eq(False).all()
          assert decision['predictive_model_refit_or_tuned_in_b11'].astype(bool).eq(False).all()
          assert decision['post_result_tuning_permitted'].astype(bool).eq(False).all()
          print('\nB11 pooled coverage')
          print(pooled.to_string(index=False))
          print('\nB11 decision')
          print(decision.to_string(index=False))
          PY
      - name: Publish compact B11 evidence
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add \
            reports/results/case_study_b11_calibration_audit.csv \
            reports/results/case_study_b11_coverage_by_year.csv \
            reports/results/case_study_b11_coverage_summary.csv \
            reports/results/case_study_b11_support_conditioned_coverage.csv \
            reports/results/case_study_b11_reliability_summary.csv \
            reports/results/case_study_b11_selective_risk.csv \
            reports/results/case_study_b11_support_error_association.csv \
            reports/results/case_study_b11_branch_decision.csv \
            reports/results/case_study_b11_b10_t1_reproduction_audit.csv \
            reports/figures/case_study_b11_forward_coverage.png \
            reports/figures/case_study_b11_selective_risk.png
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Case Study B11 forward uncertainty [skip ci]'
            git push
          fi
