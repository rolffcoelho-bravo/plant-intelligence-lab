name: Maintenance - Integrate B11 Documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-integrate-b11-docs.yml'

permissions:
  contents: write

jobs:
  integrate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate B11 into README and limitations
        run: python .github/scripts/patch_b11_docs.py
      - name: Commit integrated documentation and remove temporary files
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/maintenance-integrate-b11-docs.yml .github/scripts/patch_b11_docs.py
          git add README.md docs/limitations.md
          git commit -m 'Integrate B11 into public documentation [skip ci]'
          git push
