name: Case Study B17 - Response Amplitude Transport Audit

on:
  workflow_dispatch:
  push:
    branches:
      - agent/b17-response-amplitude-transport
    paths:
      - 'src/plant_intelligence/diagnostics/maize_b17_response_amplitude_transport.py'
      - 'tests/test_case_study_b17_response_amplitude_transport.py'
      - 'docs/case_study_b17_response_amplitude_transport_audit.md'
      - 'reports/results/case_study_b17_response_amplitude_transport_lock.json'
      - '.github/workflows/case-study-b17-response-amplitude-transport.yml'
  pull_request:
    paths:
      - 'src/plant_intelligence/diagnostics/maize_b17_response_amplitude_transport.py'
      - 'tests/test_case_study_b17_response_amplitude_transport.py'
      - 'docs/case_study_b17_response_amplitude_transport_audit.md'
      - 'reports/results/case_study_b17_response_amplitude_transport_lock.json'
      - '.github/workflows/case-study-b17-response-amplitude-transport.yml'

permissions:
  contents: write

jobs:
  response-amplitude-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Run B17 tests
        run: pytest -q tests/test_case_study_b17_response_amplitude_transport.py
      - name: Verify frozen inputs and outcome-closed lock
        run: |
          test -s reports/results/case_study_b14c_2024_primary_cohort.csv
          test -s reports/results/case_study_b16_2024_error_structure_summary.csv
          test -s reports/results/case_study_b17_response_amplitude_transport_lock.json
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('reports/results/case_study_b17_response_amplitude_transport_lock.json').read_text())
          assert lock['status'] == 'LOCKED_BEFORE_RETROSPECTIVE_DECOMPOSITION_EXECUTION'
          assert lock['parent_stage'] == 'B16_DIAGNOSTIC_COMPLETE_NO_MODEL_CHANGE'
          assert lock['expected_primary_cells'] == 779
          assert lock['expected_primary_environments'] == 19
          forbidden = [
              'new_outcome_season_access_permitted',
              'new_external_outcome_acquisition_permitted',
              'new_prediction_generation_permitted',
              'point_predictor_refit_permitted',
              'response_amplitude_rescaling_promotion_permitted',
              'interval_or_support_tuning_permitted',
              'b5_genomic_change_permitted',
              't1_clock_change_permitted',
              't2_reopen_permitted',
              'reseal_permitted',
              'post_result_tuning_permitted',
              'method_novelty_claim_permitted',
          ]
          assert all(lock[name] is False for name in forbidden)
          assert lock['predeclared_broad_novelty_decision'] == 'B17_BROAD_RESPONSE_AMPLITUDE_NOVELTY_REJECTED_OPEN_ARCHITECTURE_CONTRACTION_TEST'
          assert lock['next_stage_if_lock_valid'] == 'B17_T1_ARCHITECTURE_CONTRACTION_NOVELTY_TEST'
          PY
      - name: Execute outcome-closed B17 audit
        run: python -u -m plant_intelligence.diagnostics.maize_b17_response_amplitude_transport --output-root .
      - name: Verify B17 evidence
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          s = pd.read_csv('reports/results/case_study_b17_2024_response_amplitude_summary.csv').iloc[0]
          e = pd.read_csv('reports/results/case_study_b17_2024_response_amplitude_by_environment.csv')
          w = pd.read_csv('reports/results/case_study_b17_nonidentification_witness.csv')
          d = pd.read_csv('reports/results/case_study_b17_decision.csv').iloc[0]
          assert int(s['n_cells']) == 779
          assert int(s['n_environments']) == 19
          assert len(e) == 19
          assert np.isclose(float(s['median_predicted_to_observed_sd_ratio']), 0.2882996096719246, atol=1e-12, rtol=0.0)
          assert np.isclose(float(s['median_environment_pearson']), 0.29852299261452203, atol=1e-12, rtol=0.0)
          assert float(s['median_slope_identity_residual']) < 1e-12
          assert len(w) == 2
          assert w['same_preoutcome_information'].astype(str).str.lower().eq('true').all()
          assert w['same_prediction_vector'].astype(str).str.lower().eq('true').all()
          assert w['forecast_time_target_amplitude_point_identified'].astype(str).str.lower().eq('false').all()
          ratios = w.set_index('world')['predicted_to_observed_sd_ratio'].astype(float)
          assert np.isclose(ratios['WORLD_A'], 2.0)
          assert np.isclose(ratios['WORLD_B'], 0.5)
          assert d['decision'] == 'B17_BROAD_RESPONSE_AMPLITUDE_NOVELTY_REJECTED_OPEN_ARCHITECTURE_CONTRACTION_TEST'
          assert str(d['broad_response_amplitude_method_novelty']).lower() == 'false'
          assert str(d['new_outcome_access']).lower() == 'false'
          assert str(d['new_prediction_generation']).lower() == 'false'
          assert str(d['point_predictor_changed']).lower() == 'false'
          assert str(d['response_rescaling_promoted']).lower() == 'false'
          assert str(d['interval_or_support_tuning']).lower() == 'false'
          assert str(d['t2_reopened']).lower() == 'false'
          assert str(d['post_result_tuning_permitted']).lower() == 'false'
          assert d['next_stage'] == 'B17_T1_ARCHITECTURE_CONTRACTION_NOVELTY_TEST'
          print(s.to_string())
          print(d.to_string())
          PY
      - name: Publish B17 audit evidence
        if: github.event_name == 'push'
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add \
            reports/results/case_study_b17_2024_response_amplitude_by_environment.csv \
            reports/results/case_study_b17_2024_response_amplitude_summary.csv \
            reports/results/case_study_b17_nonidentification_witness.csv \
            reports/results/case_study_b17_decision.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish B17 response-amplitude audit [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
