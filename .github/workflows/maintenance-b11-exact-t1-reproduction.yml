name: Maintenance - Patch B11 Exact T1 Reproduction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-b11-exact-t1-reproduction.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact frozen B10-U T1 reproduction path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/plant_intelligence/uncertainty/maize_forward_uncertainty.py')
          text = path.read_text(encoding='utf-8')
          marker = 'from plant_intelligence.models.maize_forward_support_diagnostics import (\n'
          import_line = 'from plant_intelligence.models.maize_geometry_robust_aggregation import run_forward_predictions as run_b10u_forward_predictions\n'
          if import_line not in text:
              text = text.replace(marker, import_line + marker, 1)
          start = text.index('def build_forward_t1_predictions(')
          end = text.index('\ndef build_t1_support_table(', start)
          replacement = '''def build_forward_t1_predictions(\n    root: Path,\n    states: pd.DataFrame,\n    env_manifest: pd.DataFrame,\n    forward: pd.DataFrame,\n) -> pd.DataFrame:\n    \"\"\"Reproduce frozen T1 through the already-validated B10-U code path.\n\n    B10-U previously passed the exact B10 reproduction audit. B11 filters only\n    its Frozen-T1 predictions; no T2 geometry is selected, tuned, promoted, or\n    used by the B11 reliability layer.\n    \"\"\"\n\n    reproduced = run_b10u_forward_predictions(root, states, env_manifest, forward)\n    out = reproduced[reproduced[\"model\"].astype(str).eq(\"Frozen-T1\")][\n        [\"genotype\", \"environment\", \"observed\", \"test_year\", \"predicted\"]\n    ].copy()\n    lock = forward[[\"test_year\", \"train_year_max\"]].drop_duplicates().copy()\n    lock[\"test_year\"] = lock[\"test_year\"].astype(int)\n    out = out.merge(lock, on=\"test_year\", how=\"left\", validate=\"many_to_one\")\n    if out[\"train_year_max\"].isna().any():\n        raise ValueError(\"B11 could not align reproduced T1 predictions with the B9 chronology lock.\")\n    out[\"train_year_max\"] = out[\"train_year_max\"].astype(int)\n    out[\"absolute_error\"] = np.abs(out[\"observed\"].to_numpy(float) - out[\"predicted\"].to_numpy(float))\n    if out[\"predicted\"].isna().any():\n        raise ValueError(\"B11 T1 prediction reproduction contains missing predictions.\")\n    return out\n\n'''
          text = text[:start] + replacement + text[end+1:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/maintenance-b11-exact-t1-reproduction.yml
          git add src/plant_intelligence/uncertainty/maize_forward_uncertainty.py
          git commit -m 'Use exact frozen B10-U T1 reproduction in B11 [skip ci]'
          git push
