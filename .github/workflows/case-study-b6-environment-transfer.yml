name: Case Study B — Continuous Environment Transfer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/models/maize_environment_transfer.py'
      - 'src/plant_intelligence/data/maize_environment_transfer.py'
      - 'tests/test_case_study_b6_environment_transfer.py'
      - '.github/workflows/case-study-b6-environment-transfer.yml'

permissions:
  contents: write

jobs:
  environment-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Validate Step B6 implementation
        run: pytest -q tests/test_case_study_b6_environment_transfer.py

      - name: Materialize locked B5 public data and manifests
        run: python -u -m plant_intelligence.data.maize_environment_transfer --output-root .

      - name: Execute Step B6 continuous-environment transfer benchmark
        run: python -u -m plant_intelligence.models.maize_environment_transfer --output-root .

      - name: Verify Step B6 evidence
        run: |
          test -s reports/results/case_study_b6_transfer_summary.csv
          test -s reports/results/case_study_b6_transfer_fold_metrics.csv
          test -s reports/results/case_study_b6_transfer_bootstrap.csv
          test -s reports/results/case_study_b6_feature_audit.csv
          test -s reports/figures/case_study_b6_environment_transfer.png
          cat reports/results/case_study_b6_transfer_summary.csv
          cat reports/results/case_study_b6_transfer_bootstrap.csv

      - name: Publish compact Step B6 evidence
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            reports/results/case_study_b6_transfer_summary.csv \
            reports/results/case_study_b6_transfer_fold_metrics.csv \
            reports/results/case_study_b6_transfer_bootstrap.csv \
            reports/results/case_study_b6_feature_audit.csv \
            reports/figures/case_study_b6_environment_transfer.png
          if git diff --cached --quiet; then
            echo 'No new Step B6 outputs to publish.'
          else
            git commit -m 'Publish Case Study B6 environment-transfer evidence [skip ci]'
            git push
          fi
