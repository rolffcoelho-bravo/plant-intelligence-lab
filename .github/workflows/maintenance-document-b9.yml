name: Maintenance - Document Case Study B9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-document-b9.yml'

permissions:
  contents: write

jobs:
  document-b9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply documentation consolidation
        run: |
          python .github/scripts/patch_b9_docs.py
          python .github/scripts/cleanup_b9_docs.py
      - name: Commit documentation
        run: |
          git config user.name plant-intelligence-lab-bot
          git config user.email actions@users.noreply.github.com
          git add README.md docs/limitations.md
          if git diff --cached --quiet; then
            echo 'No documentation changes.'
          else
            git commit -m 'Finalize B9 public documentation [skip ci]'
            git push
          fi
