name: Case Study B13 - Pre-Outcome Lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/plant_intelligence/uncertainty/maize_b13_forward_drift_calibration.py'
      - 'tests/test_case_study_b13_forward_drift_calibration.py'
      - 'reports/results/case_study_b13_preoutcome_lock.csv'
      - 'docs/case_study_b13_forward_drift_calibration.md'
      - '.github/workflows/case-study-b13-preoutcome-lock.yml'

jobs:
  validate-b13-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Test B13 mathematical and protocol invariants
        run: pytest -q tests/test_case_study_b13_forward_drift_calibration.py

      - name: Verify deterministic pre-outcome lock
        run: |
          python - <<'PY'
          import pandas as pd
          from plant_intelligence.uncertainty.maize_b13_forward_drift_calibration import drift_guard_state

          lock = pd.read_csv('reports/results/case_study_b13_preoutcome_lock.csv')
          assert len(lock) == 1
          row = lock.iloc[0]
          state = drift_guard_state(float(row['previous_environment_balanced_coverage']))
          assert abs(float(row['adaptive_quantile_level']) - state.adaptive_quantile_level) < 1e-12
          assert row['control_rule'] == 'FROZEN_B11_90'
          assert row['adaptive_rule'] == 'ONE_SIDED_CLUSTER_DRIFT_GUARD_90'
          assert row['primary_estimand'] == 'OFFICIALLY_OBSERVABLE_SEALED_KEYS'
          for col in (
              'selection_uses_outcome_value',
              'post_reveal_protocol_amendment',
              'point_predictor_changed',
              't2_branch_reopened',
              'post_result_tuning_permitted',
          ):
              assert str(row[col]).strip().lower() == 'false'
          assert row['stage_state'] == 'B13_PREOUTCOME_CALIBRATION_RULE_LOCKED'
          print(lock.to_string(index=False))
          PY
