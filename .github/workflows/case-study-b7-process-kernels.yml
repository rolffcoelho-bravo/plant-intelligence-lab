name: Case Study B — Biological Environment Kernels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/plant_intelligence/models/maize_environment_process_kernels.py'
      - 'src/plant_intelligence/models/maize_environment_transfer_robustness.py'
      - 'src/plant_intelligence/data/maize_environment_transfer.py'
      - 'tests/test_case_study_b7_process_kernels.py'
      - '.github/workflows/case-study-b7-process-kernels.yml'

permissions:
  contents: write

jobs:
  biological-environment-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Validate Step B7 implementation
        run: pytest -q tests/test_case_study_b7_process_kernels.py

      - name: Materialize locked B5 public data and manifests
        run: python -u -m plant_intelligence.data.maize_environment_transfer --output-root .

      - name: Execute Step B7 biological environmental representation
        run: python -u -m plant_intelligence.models.maize_environment_process_kernels --output-root .

      - name: Verify Step B7 evidence
        run: |
          test -s reports/results/case_study_b7_process_kernel_summary.csv
          test -s reports/results/case_study_b7_process_kernel_bootstrap.csv
          test -s reports/results/case_study_b7_environment_metrics.csv
          test -s reports/results/case_study_b7_ecov_leakage_audit.csv
          test -s reports/results/case_study_b7_environment_block_summary.csv
          test -s reports/results/case_study_b7_design_audit.csv
          test -s reports/figures/case_study_b7_process_kernel_ablation.png
          cat reports/results/case_study_b7_process_kernel_summary.csv
          cat reports/results/case_study_b7_environment_block_summary.csv
          cat reports/results/case_study_b7_process_kernel_bootstrap.csv

      - name: Publish compact Step B7 evidence
        run: |
          git config user.name 'plant-intelligence-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            reports/results/case_study_b7_process_kernel_summary.csv \
            reports/results/case_study_b7_process_kernel_bootstrap.csv \
            reports/results/case_study_b7_environment_metrics.csv \
            reports/results/case_study_b7_ecov_leakage_audit.csv \
            reports/results/case_study_b7_environment_block_summary.csv \
            reports/results/case_study_b7_design_audit.csv \
            reports/figures/case_study_b7_process_kernel_ablation.png
          if git diff --cached --quiet; then
            echo 'No new Step B7 outputs to publish.'
          else
            git commit -m 'Publish Case Study B7 biological-environment evidence [skip ci]'
            git push
          fi
