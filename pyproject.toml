[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-intelligence-lab"
version = "0.1.0"
description = "Genomic prediction, phenotype forecasting, uncertainty-aware modelling and AI-assisted experimental design for plant biotechnology."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rodolfo Pereira" }
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "requests>=2.31",
  "h5py>=3.10"
]

[project.optional-dependencies]
ml = [
  "xgboost>=2.0",
  "lightgbm>=4.3"
]
notebooks = [
  "pyarrow>=15.0",
  "jupyterlab>=4.1",
  "ipykernel>=6.29",
  "nbconvert>=7.16"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]
full = [
  "xgboost>=2.0",
  "lightgbm>=4.3",
  "pyarrow>=15.0",
  "jupyterlab>=4.1",
  "ipykernel>=6.29",
  "nbconvert>=7.16"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
